name: Release Mobile App

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'CodeMentorAI Mobile Release'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Environment Variables
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          else
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}" > .env
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'placeholder' }}" >> .env
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Build Split per ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename Artifacts with Release Tag
        id: prepare_files
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          mkdir -p release_assets
          cp build/app/outputs/flutter-apk/app-release.apk "release_assets/codementorai-universal-${TAG}.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "release_assets/codementorai-arm64-v8a-${TAG}.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release_assets/codementorai-armeabi-v7a-${TAG}.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "release_assets/codementorai-x86_64-${TAG}.apk"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_files.outputs.tag }}
          name: ${{ github.event.inputs.release_title || steps.prepare_files.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
